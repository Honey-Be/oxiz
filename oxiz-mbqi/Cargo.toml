[package]
name = "oxiz-mbqi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Clean-room quantifier-instantiation engine (e-matching + MBQI + CDQI) with a never-conclude-unsat soundness invariant. Host-agnostic via TermLang; the OxiZ host impl lives in oxiz-solver."
keywords = ["smt", "mbqi", "quantifier", "ematching"]
categories = ["algorithms"]

[dependencies]
# FxHashMap/FxHashSet need the `std` feature.
rustc-hash = { workspace = true, default-features = false, features = ["std"] }
