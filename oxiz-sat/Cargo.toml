[package]
name = "oxiz-sat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance CDCL SAT Solver for OxiZ"
keywords = ["sat", "cdcl", "solver"]
categories = ["algorithms"]

[features]
default = ["std"]
std = ["rayon", "tracing", "rustc-hash/std", "oxiz-core/std", "portable-queues/std", "portable-collection-primitives/std"]
profiling = ["std", "oxiz-core/profiling"]
# Enable verbose debug output in conflict analysis
analyze-debug = []
# Instrument analyze_theory_conflict to detect the p==None / Lit::from_code(0)
# placeholder leak (off by default; used by the theory-callback fuzz harness).
theory-probe = []
# GPU acceleration backends (placeholder for future implementation)
cuda = []
opencl = []
vulkan = []

[dependencies]
oxiz-core = { workspace = true, default-features = false }
tracing = { workspace = true, default-features = false, optional = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }
hashbrown.workspace = true
portable-atomic-util = { workspace = true }
libm.workspace = true
# `VecScopedStack<ClauseId>` — the per-push clause-id undo ledger (see
# `Solver::pop`). Needs `alloc` (the type is behind the crate's `ifstdoralloc!`
# gate); `std` is forwarded above.
portable-queues = { workspace = true, default-features = false, features = ["alloc"] }
# The trait vocabulary `VecScopedStack` implements (Push/ScopedRollback/
# ScopedStack/Container/Checkpoint) — needed in scope to call its methods.
portable-collection-primitives = { workspace = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

# Profile-Guided Optimization (PGO) Configuration
#
# To use PGO for maximum performance:
#
# 1. Build with instrumentation:
#    RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" cargo build --release
#
# 2. Run representative workload to generate profile data:
#    ./target/release/oxiz-sat <your-benchmark-files>
#
# 3. Merge profile data:
#    llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data
#
# 4. Build with PGO:
#    RUSTFLAGS="-Cprofile-use=/tmp/pgo-data/merged.profdata -Cllvm-args=-pgo-warn-missing-function" cargo build --release
#
# For SIMD optimizations, use:
#    RUSTFLAGS="-C target-cpu=native" cargo build --release
