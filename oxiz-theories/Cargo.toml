[package]
name = "oxiz-theories"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Theory Solvers (EUF, Arithmetic, BitVectors) for OxiZ"
keywords = ["smt", "theories", "euf", "arithmetic"]
categories = ["algorithms", "mathematics"]

[dependencies]
oxiz-core = { workspace = true, default-features = false }
oxiz-sat = { workspace = true, default-features = false }
oxiz-math = { workspace = true, default-features = false }
tracing = { workspace = true, default-features = false, optional = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
num-rational = { workspace = true, default-features = false, features = ["num-bigint"] }
num-bigint = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
hashbrown.workspace = true
portable-atomic-util = { workspace = true }
# `FlatRadixBimap` — the dense-id term↔var interner backend for `ArithSolver`.
# `FlatRadixBimap` lives behind the crate's `ifstdoralloc!` gate, so it needs at
# least `alloc`; `std` is forwarded below for the no_std-off default build.
portable-bijectives = { workspace = true, default-features = false, features = ["alloc"] }

# Optional (std-only)
egg = { workspace = true, optional = true }
oxiz-nlsat = { workspace = true, optional = true }
# Sound nonlinear oracle (G-SAT/G-UNSAT gated) consulted by the NIA/NRA dispatch
# before the legacy NlsatSolver. std-only, like oxiz-nlsat.
oxiz-nl2 = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
    "oxiz-core/std",
    "oxiz-sat/std",
    "oxiz-math/std",
    "egg",
    "oxiz-nlsat",
    "oxiz-nl2",
    "tracing",
    "tracing/std",
    "num-rational/std",
    "num-bigint/std",
    "num-traits/std",
    "rustc-hash/std",
    "portable-bijectives/std",
]
profiling = ["std", "oxiz-core/profiling", "oxiz-sat/profiling"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "simplex_benchmarks"
harness = false

[[bench]]
name = "euf_benchmarks"
harness = false
