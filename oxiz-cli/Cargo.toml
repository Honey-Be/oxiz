[package]
name = "oxiz-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for OxiZ SMT Solver (SMT-LIB2 compliant)"
keywords = ["smt", "cli", "smtlib"]
categories = ["command-line-utilities"]

[[bin]]
name = "oxiz"
path = "src/main.rs"
doc = false

[dependencies]
oxiz-core = { workspace = true, features = ["std"] }
oxiz-solver = { workspace = true, features = ["std"] }
oxiz-opt = { workspace = true }
oxiz-proof = { workspace = true }
oxiz-smtcomp = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rustyline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
owo-colors = { workspace = true }
indicatif = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
notify = { workspace = true }
sysinfo = { workspace = true }
rayon = { workspace = true }
dirs = { workspace = true }
tower-lsp = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
chrono = "0.4"
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rustc-hash = { workspace = true, features = ["std"] }

[features]
# E2a passthrough: EUF union-find find/hop counters (see oxiz-theories).
# `cargo build --release -p oxiz-cli --features euf-find-stats` yields an
# `oxiz` binary that prints "[euf-stats] finds=N hops=M avg=X.XX" to stderr
# at solver drop when OXIZ_EUF_STATS is set.
euf-find-stats = ["oxiz-solver/euf-find-stats"]
